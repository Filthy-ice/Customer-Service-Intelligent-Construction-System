name: gate
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 桌面端 tauri 编译需要的系统库（与本机开发环境一致）
      - name: install tauri system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      # 生成栈工具链：go 按 .go-version 显式安装（S6 go 验证测试需要）；
      # java/maven/python3 用 ubuntu-latest 镜像自带版本
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - name: fmt check
        run: cargo fmt --all --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cargo test --workspace

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ajv recheck (dual channel)
        working-directory: crates/icewright-artifact/contracts
        run: |
          npm ci
          npm test
