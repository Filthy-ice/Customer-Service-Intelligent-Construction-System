name: release
# 打 v* 标签即构建桌面端 deb 并挂到 GitHub Release（草稿默认关闭，直接发布）。
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install tauri system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev
      - name: build & bundle deb
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: crates/icewright-desktop
          args: --bundles deb
          includeDraft: false
