<!DOCTYPE html>
<!-- AUTO-GENERATED BY IceWright {{engine_version}} · 重生成会检测本地修改而非静默覆盖（加 ICEWRIGHT-CUSTOM 标记则完全交给定制层） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project_name}} · 开发后台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; }
  header nav a { font-size: 14px; color: #2563eb; text-decoration: none; margin-left: 12px; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
  .card { border: 1px solid #8884; border-radius: 12px; padding: 10px 12px; }
  .card .k { font-size: 12px; opacity: .65; }
  .card .v { font-size: 16px; font-weight: 600; margin-top: 2px; word-break: break-all; }
  section { border: 1px solid #8884; border-radius: 12px; padding: 12px; }
  section h2 { font-size: 16px; margin: 0 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8883; vertical-align: top; }
  th { font-size: 12px; opacity: .7; }
  details summary { cursor: pointer; font-size: 12px; opacity: .7; }
  pre { font-size: 12px; overflow-x: auto; margin: 6px 0 0; }
  #error { color: #b91c1c; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 1px 6px; border: 1px solid #8884; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div>
      <nav><a id="link-chat" href="/"></a></nav>
      <label><select id="lang" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select></label>
    </div>
  </header>
  <div id="error"></div>
  <div class="cards" id="runtime"></div>
  <section><h2 id="h-rules"></h2><table id="rules"></table></section>
  <section><h2 id="h-skills"></h2><table id="skills"></table></section>
  <section><h2 id="h-apis"></h2><table id="apis"></table></section>
</div>
<script>
"use strict";
// 只读页面：全部数据来自 /admin/overview（契约文件 + 运行态），不查询任何业务数据。
var I18N = {
  zh: { title: "开发后台（只读）", link_chat: "调试聊天页", runtime: "运行态",
        rules: "规则表", skills: "技能表", apis: "接口契约", raw: "原文",
        loading: "加载中…", load_error: "加载失败：",
        fields: { project: "项目", pack_ref: "行业包", redis: "Redis", languages: "支持语言",
                  model_configured: "模型已配置", core_mode: "核心系统模式", business_console: "业务后台" },
        bool: { true: "是", false: "否" },
        cols: { id: "ID", type: "类型", enforcement_point: "执行点", statement: "规则语句",
                name: "名称", status: "状态", method: "方法", endpoint: "端点",
                confirmed_by_customer: "客户确认" } },
  en: { title: "Developer Console (read-only)", link_chat: "Debug Chat", runtime: "Runtime",
        rules: "Rules", skills: "Skills", apis: "API Contracts", raw: "raw",
        loading: "Loading…", load_error: "Load failed: ",
        fields: { project: "Project", pack_ref: "Industry pack", redis: "Redis", languages: "Languages",
                  model_configured: "Model configured", core_mode: "Core system mode", business_console: "Business console" },
        bool: { true: "yes", false: "no" },
        cols: { id: "ID", type: "Type", enforcement_point: "Enforcement", statement: "Statement",
                name: "Name", status: "Status", method: "Method", endpoint: "Endpoint",
                confirmed_by_customer: "Customer-confirmed" } }
};
var lang = localStorage.getItem("iw-lang") || "zh";
var $ = function (id) { return document.getElementById(id); };

function D() { return I18N[lang] || I18N.zh; }

function txt(v) {
  if (typeof v === "boolean") { return D().bool[String(v)]; }
  if (v === null || v === undefined) { return "-"; }
  if (Array.isArray(v)) { return v.join(", "); }
  return esc(String(v));
}

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function table(el, rows, cols) {
  var d = D();
  var html = "<thead><tr>" + cols.map(function (c) { return "<th>" + d.cols[c] + "</th>"; }).join("") + "</tr></thead><tbody>";
  rows.forEach(function (r) {
    html += "<tr>" + cols.map(function (c) { return "<td>" + txt(r[c]) + "</td>"; }).join("") + "</tr>";
    html += "<tr><td colspan='" + cols.length + "'><details><summary>" + d.raw + "</summary><pre>" +
            esc(JSON.stringify(r, null, 2)) + "</pre></details></td></tr>";
  });
  el.innerHTML = html + "</tbody>";
}

function render(o) {
  var d = D();
  $("h-rules").textContent = d.rules + " (" + o.rules.length + ")";
  $("h-skills").textContent = d.skills + " (" + o.skills.length + ")";
  $("h-apis").textContent = d.apis + " (" + o.apis.length + ")";
  $("runtime").innerHTML = Object.keys(d.fields).map(function (k) {
    return "<div class='card'><div class='k'>" + d.fields[k] + "</div><div class='v'>" + txt(o[k]) + "</div></div>";
  }).join("");
  table($("rules"), o.rules, ["id", "type", "enforcement_point", "statement"]);
  table($("skills"), o.skills, ["id", "name", "status"]);
  table($("apis"), o.apis, ["id", "method", "endpoint", "confirmed_by_customer"]);
}

function applyLang() {
  var d = D();
  document.title = "{{project_name}} · " + d.title;
  $("title").textContent = d.title;
  $("link-chat").textContent = d.link_chat;
  $("lang").value = lang;
  document.documentElement.lang = lang;
}

$("lang").addEventListener("change", function () {
  lang = this.value;
  localStorage.setItem("iw-lang", lang);
  applyLang();
  load();
});

function load() {
  fetch("/admin/overview").then(function (r) {
    if (!r.ok) { throw new Error("HTTP " + r.status); }
    return r.json();
  }).then(render).catch(function (e) {
    $("error").textContent = D().load_error + e.message;
  });
}

applyLang();
$("runtime").textContent = D().loading;
load();
</script>
</body>
</html>
