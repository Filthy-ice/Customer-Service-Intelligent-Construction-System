<!DOCTYPE html>
<!-- AUTO-GENERATED BY IceWright {{engine_version}} · 重生成会检测本地修改而非静默覆盖（加 ICEWRIGHT-CUSTOM 标记则完全交给定制层） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project_name}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 640px; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  #log { flex: 1; overflow-y: auto; border: 1px solid #8884; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 320px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #8882; }
  .meta { font-size: 11px; opacity: .65; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  button { padding: 10px 16px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <div>
      <nav style="display:inline"><a id="link-admin" href="/admin" style="font-size:13px;color:inherit;opacity:.7"></a></nav>
      <label style="margin-left:10px"><select id="lang" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select></label>
    </div>
  </header>
  <div id="log"></div>
  <form id="chat-form">
    <input type="text" id="input" autocomplete="off" maxlength="4000">
    <button type="submit" id="send"></button>
  </form>
  <div style="display:flex;gap:6px;align-items:center;font-size:12px;opacity:.75;flex-wrap:wrap">
    <span id="id-label"></span>
    <input type="text" id="id-user" maxlength="128" style="width:110px;padding:4px 8px;border-radius:8px;border:1px solid #999;background:transparent;color:inherit;font-size:12px">
    <input type="text" id="id-group" maxlength="128" style="width:100px;padding:4px 8px;border-radius:8px;border:1px solid #999;background:transparent;color:inherit;font-size:12px">
    <select id="id-role" style="padding:4px 6px;font-size:12px">
      <option value="customer">customer</option>
      <option value="agent">agent</option>
      <option value="developer">developer</option>
    </select>
  </div>
</div>
<script>
"use strict";
// 文案目录与 app/domain/i18n.py 支持的语种保持一致（zh/en）。
var I18N = {
  zh: { title: "客服助手", send: "发送", input_placeholder: "请输入您的问题…",
        thinking: "正在思考…", error_prefix: "请求失败：", rule_note: "命中规则",
        slots_note: "会话槽位", admin_link: "开发后台",
        id_label: "调试身份（网关注入的头，此处直连模拟）：用户/组/类型" },
  en: { title: "Service Agent", send: "Send", input_placeholder: "Type your question…",
        thinking: "Thinking…", error_prefix: "Request failed: ", rule_note: "Matched rules",
        slots_note: "Session slots", admin_link: "Developer console",
        id_label: "Debug identity (simulates gateway-injected headers): user/group/role" }
};
var lang = localStorage.getItem("iw-lang") || "zh";
var sessionId = localStorage.getItem("iw-session") || ("web-" + Math.random().toString(36).slice(2, 10));
localStorage.setItem("iw-session", sessionId);

var $ = function (id) { return document.getElementById(id); };

// 身份头：生产由客户网关注入并签名；此页仅调试模式（未配 IW_AUTH_SECRET）可用。
function initIdentity() {
  $("id-user").value = localStorage.getItem("iw-id-user") || "web-user";
  $("id-group").value = localStorage.getItem("iw-id-group") || "default";
  $("id-role").value = localStorage.getItem("iw-id-role") || "customer";
  [["id-user"], ["id-group"], ["id-role"]].forEach(function (p) {
    $(p[0]).addEventListener("change", function () {
      localStorage.setItem("iw-id-" + p[0].slice(3), this.value.trim());
    });
  });
}
function idHeaders(extra) {
  var h = extra || {};
  h["X-IW-User"] = $("id-user").value.trim();
  h["X-IW-Group"] = $("id-group").value.trim();
  h["X-IW-Role"] = $("id-role").value;
  return h;
}

function applyLang() {
  var d = I18N[lang] || I18N.zh;
  $("title").textContent = d.title;
  $("send").textContent = d.send;
  $("input").placeholder = d.input_placeholder;
  $("link-admin").textContent = d.admin_link;
  $("id-label").textContent = d.id_label;
  $("lang").value = lang;
  document.documentElement.lang = lang;
}

function addMsg(role, text, meta) {
  var el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "bot");
  el.textContent = text;
  if (meta) {
    var m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    el.appendChild(m);
  }
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

function showSlots(bubble) {
  // 调试页专有的槽位回显：读取本会话在 Redis 中的易失状态，失败不影响对话本身。
  fetch("/sessions/" + encodeURIComponent(sessionId), { headers: idHeaders() }).then(function (r) {
    return r.ok ? r.json() : null;
  }).then(function (d) {
    if (!d || !d.slots) { return; }
    var keys = Object.keys(d.slots);
    if (!keys.length) { return; }
    var m = document.createElement("div");
    m.className = "meta";
    m.textContent = (I18N[lang] || I18N.zh).slots_note + ": " +
      keys.map(function (k) { return k + "=" + d.slots[k]; }).join(", ");
    bubble.appendChild(m);
  }).catch(function () { /* 回显失败静默 */ });
}

$("lang").addEventListener("change", function () {
  lang = this.value;
  localStorage.setItem("iw-lang", lang);
  applyLang();
});

$("chat-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var text = $("input").value.trim();
  if (!text) { return; }
  $("input").value = "";
  $("send").disabled = true;
  addMsg("user", text);
  var pending = addMsg("bot", (I18N[lang] || I18N.zh).thinking);
  fetch("/chat", {
    method: "POST",
    headers: idHeaders({ "Content-Type": "application/json" }),
    body: JSON.stringify({ session_id: sessionId, message: text, language: lang })
  }).then(function (resp) {
    if (!resp.ok) { throw new Error("HTTP " + resp.status); }
    return resp.json();
  }).then(function (data) {
    pending.textContent = data.reply;
    var rules = data.matched_rules || [];
    if (rules.length) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = (I18N[lang] || I18N.zh).rule_note + ": " + rules.join(", ");
      pending.appendChild(m);
    }
    showSlots(pending);
  }).catch(function (err) {
    pending.textContent = (I18N[lang] || I18N.zh).error_prefix + err.message;
  }).finally(function () {
    $("send").disabled = false;
    $("input").focus();
  });
});

initIdentity();
applyLang();
</script>
</body>
</html>
