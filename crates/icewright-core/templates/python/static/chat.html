<!DOCTYPE html>
<!-- AUTO-GENERATED BY IceWright {{engine_version}} · 重生成会检测本地修改而非静默覆盖（加 ICEWRIGHT-CUSTOM 标记则完全交给定制层） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project_name}}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; display: flex; justify-content: center; min-height: 100vh; }
  .app { width: 100%; max-width: 640px; display: flex; flex-direction: column; padding: 16px; gap: 12px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 18px; margin: 0; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  #log { flex: 1; overflow-y: auto; border: 1px solid #8884; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 320px; }
  .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #8882; }
  .meta { font-size: 11px; opacity: .65; margin-top: 4px; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 10px 12px; border-radius: 10px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  button { padding: 10px 16px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  button[disabled] { opacity: .5; cursor: wait; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="title"></h1>
    <label><select id="lang" aria-label="language">
      <option value="zh">中文</option>
      <option value="en">English</option>
    </select></label>
  </header>
  <div id="log"></div>
  <form id="chat-form">
    <input type="text" id="input" autocomplete="off" maxlength="4000">
    <button type="submit" id="send"></button>
  </form>
</div>
<script>
"use strict";
// 文案目录与 app/domain/i18n.py 支持的语种保持一致（zh/en）。
var I18N = {
  zh: { title: "客服助手", send: "发送", input_placeholder: "请输入您的问题…",
        thinking: "正在思考…", error_prefix: "请求失败：", rule_note: "命中规则" },
  en: { title: "Service Agent", send: "Send", input_placeholder: "Type your question…",
        thinking: "Thinking…", error_prefix: "Request failed: ", rule_note: "Matched rules" }
};
var lang = localStorage.getItem("iw-lang") || "zh";
var sessionId = localStorage.getItem("iw-session") || ("web-" + Math.random().toString(36).slice(2, 10));
localStorage.setItem("iw-session", sessionId);

var $ = function (id) { return document.getElementById(id); };

function applyLang() {
  var d = I18N[lang] || I18N.zh;
  $("title").textContent = d.title;
  $("send").textContent = d.send;
  $("input").placeholder = d.input_placeholder;
  $("lang").value = lang;
  document.documentElement.lang = lang;
}

function addMsg(role, text, meta) {
  var el = document.createElement("div");
  el.className = "msg " + (role === "user" ? "user" : "bot");
  el.textContent = text;
  if (meta) {
    var m = document.createElement("div");
    m.className = "meta";
    m.textContent = meta;
    el.appendChild(m);
  }
  $("log").appendChild(el);
  $("log").scrollTop = $("log").scrollHeight;
  return el;
}

$("lang").addEventListener("change", function () {
  lang = this.value;
  localStorage.setItem("iw-lang", lang);
  applyLang();
});

$("chat-form").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var text = $("input").value.trim();
  if (!text) { return; }
  $("input").value = "";
  $("send").disabled = true;
  addMsg("user", text);
  var pending = addMsg("bot", (I18N[lang] || I18N.zh).thinking);
  fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sessionId, message: text, language: lang })
  }).then(function (resp) {
    if (!resp.ok) { throw new Error("HTTP " + resp.status); }
    return resp.json();
  }).then(function (data) {
    pending.textContent = data.reply;
    var rules = data.matched_rules || [];
    if (rules.length) {
      var m = document.createElement("div");
      m.className = "meta";
      m.textContent = (I18N[lang] || I18N.zh).rule_note + ": " + rules.join(", ");
      pending.appendChild(m);
    }
  }).catch(function (err) {
    pending.textContent = (I18N[lang] || I18N.zh).error_prefix + err.message;
  }).finally(function () {
    $("send").disabled = false;
    $("input").focus();
  });
});

applyLang();
</script>
</body>
</html>
