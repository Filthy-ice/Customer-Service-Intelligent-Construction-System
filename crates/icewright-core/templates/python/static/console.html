<!DOCTYPE html>
<!-- AUTO-GENERATED BY IceWright {{engine_version}} · 重生成会检测本地修改而非静默覆盖（加 ICEWRIGHT-CUSTOM 标记则完全交给定制层） -->
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{project_name}} · 业务后台</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header h1 { font-size: 20px; margin: 0; }
  header nav a { font-size: 14px; color: #2563eb; text-decoration: none; margin-left: 12px; }
  select { padding: 6px 8px; border-radius: 8px; border: 1px solid #999; background: transparent; color: inherit; font-size: 14px; }
  button { padding: 8px 14px; border: 0; border-radius: 10px; background: #2563eb; color: #fff; font-size: 14px; cursor: pointer; }
  section { border: 1px solid #8884; border-radius: 12px; padding: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #8883; }
  th { font-size: 12px; opacity: .7; }
  #status { font-size: 13px; opacity: .75; }
  #error { color: #b91c1c; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <div>
      <nav><a id="link-chat" href="/"></a></nav>
      <label><select id="lang" aria-label="language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select></label>
    </div>
  </header>
  <div id="error"></div>
  <section>
    <p id="note"></p>
    <p><button id="refresh"></button> <span id="status"></span></p>
    <table id="sessions"></table>
  </section>
</div>
<script>
"use strict";
// 待人工关注会话列表：数据来自 /console/sessions（仅规则打标会话，不展示对话内容）。
var I18N = {
  zh: { title: "业务后台 · 待关注会话", link_chat: "调试聊天页", refresh: "刷新",
        note: "命中拦截/转人工/禁语规则的会话会出现在这里；页面不展示任何业务数据。",
        empty: "暂无待关注会话", loaded: "已加载", load_error: "加载失败：",
        cols: { session_id: "会话 ID", flagged: "命中规则", turns: "对话轮数" } },
  en: { title: "Business Console · Sessions Need Attention", link_chat: "Debug Chat", refresh: "Refresh",
        note: "Sessions that hit block/handover/forbidden rules appear here; no business data is shown.",
        empty: "No sessions need attention", loaded: "Loaded", load_error: "Load failed: ",
        cols: { session_id: "Session ID", flagged: "Matched rule", turns: "Turns" } }
};
var lang = localStorage.getItem("iw-lang") || "zh";
var $ = function (id) { return document.getElementById(id); };
function D() { return I18N[lang] || I18N.zh; }
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function applyLang() {
  var d = D();
  document.title = "{{project_name}} · " + d.title;
  $("title").textContent = d.title;
  $("link-chat").textContent = d.link_chat;
  $("refresh").textContent = d.refresh;
  $("note").textContent = d.note;
  $("lang").value = lang;
  document.documentElement.lang = lang;
}

function load() {
  fetch("/console/sessions").then(function (r) {
    if (!r.ok) { throw new Error("HTTP " + r.status); }
    return r.json();
  }).then(function (rows) {
    var d = D();
    $("status").textContent = d.loaded + " (" + rows.length + ")";
    if (!rows.length) { $("sessions").innerHTML = ""; $("status").textContent = d.empty; return; }
    $("sessions").innerHTML =
      "<thead><tr>" + Object.keys(d.cols).map(function (c) { return "<th>" + d.cols[c] + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function (s) {
        return "<tr><td>" + esc(String(s.session_id)) + "</td><td>" + esc(String(s.flagged)) +
               "</td><td>" + esc(String(s.turns)) + "</td></tr>";
      }).join("") + "</tbody>";
  }).catch(function (e) {
    $("error").textContent = D().load_error + e.message;
  });
}

$("lang").addEventListener("change", function () {
  lang = this.value;
  localStorage.setItem("iw-lang", lang);
  applyLang();
  load();
});
$("refresh").addEventListener("click", load);

applyLang();
load();
</script>
</body>
</html>
