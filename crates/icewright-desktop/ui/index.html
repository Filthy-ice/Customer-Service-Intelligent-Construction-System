<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IceWright 构建监控</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside>
      <h1>IceWright <span id="ver"></span></h1>
      <div class="section-title" data-i18n="workspaces">工作区</div>
      <ul id="ws-list"></ul>
      <div class="hint"><span data-i18n="hint_pre">运行</span>
        <code>icewright ws new &lt;id&gt;</code><span data-i18n="hint_post">创建新工作区</span>
      </div>
    </aside>
    <main>
      <div id="empty" class="empty" data-i18n="empty_pick">选择左侧工作区查看进度与历史</div>
      <section id="detail" class="hidden">
        <header>
          <h2 id="ws-title"></h2>
          <div id="run-meta"></div>
        </header>
        <div id="stepper" class="stepper"></div>
        <section id="actions" class="actions">
          <input id="op-note" type="text" placeholder="驳回原因（驳回类操作必填）" />
          <div id="op-buttons"></div>
        </section>
        <pre id="op-result" class="op-result hidden"></pre>
        <table class="stages">
          <thead>
            <tr><th data-i18n="th_stage">阶段</th><th data-i18n="th_name">名称</th><th data-i18n="th_status">状态</th><th data-i18n="th_hash">产物哈希</th><th data-i18n="th_gate">闸门</th></tr>
          </thead>
          <tbody id="stage-rows"></tbody>
        </table>
        <h3 data-i18n="history">生成历史</h3>
        <ul id="history"></ul>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
