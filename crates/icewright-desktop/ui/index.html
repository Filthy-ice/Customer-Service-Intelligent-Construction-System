<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IceWright 构建监控</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside>
      <h1>IceWright <span id="ver"></span></h1>
      <div class="section-title">工作区</div>
      <ul id="ws-list"></ul>
      <div class="hint">运行 <code>icewright ws new &lt;id&gt;</code> 创建新工作区</div>
    </aside>
    <main>
      <div id="empty" class="empty">选择左侧工作区查看进度与历史</div>
      <section id="detail" class="hidden">
        <header>
          <h2 id="ws-title"></h2>
          <div id="run-meta"></div>
        </header>
        <div id="stepper" class="stepper"></div>
        <table class="stages">
          <thead>
            <tr><th>阶段</th><th>名称</th><th>状态</th><th>产物哈希</th><th>闸门</th></tr>
          </thead>
          <tbody id="stage-rows"></tbody>
        </table>
        <h3>生成历史</h3>
        <ul id="history"></ul>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
